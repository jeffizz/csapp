services:
  csapp:
    build:
      context: .
      dockerfile: Dockerfile
    image: csapp-lab:latest
    platform: linux/amd64
    container_name: csapp
    tty: true
    stdin_open: true
    volumes:
      - ./:/csapp
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - DISPLAY=host.docker.internal:0
    deploy:
      resources:
        limits:
          memory: 4G
